<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal Hackers CSB - Report Toolkit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Hind+Siliguri:wght@400;600;700&display=swap');
    
    body {
      font-family: 'Hind Siliguri', 'Fira Code', sans-serif;
      background-color: #090d16;
      color: #e2e8f0;
    }
    .matrix-glow {
      box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 255, 65, 0.15);
    }
    .glass-card:hover {
      border-color: rgba(0, 255, 65, 0.4);
    }
    .folder-header {
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.1) 0%, rgba(15, 23, 42, 0.8) 100%);
    }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Header Section -->
  <header class="border-b border-emerald-500/20 bg-slate-950/80 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-emerald-500/10 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-bold text-xl matrix-glow">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-emerald-400 tracking-wide">SIGNAL HACKERS CSB</h1>
          <p class="text-xs text-slate-400">All Class Report Link & Additional Toolkit</p>
        </div>
      </div>
      
      <!-- Search & Admin Button -->
      <div class="flex items-center gap-3 w-full md:w-auto">
        <div class="relative w-full md:w-64">
          <input type="text" id="searchInput" placeholder="Klas ba report khujun..." 
                 class="w-full bg-slate-900/90 border border-emerald-500/30 rounded-lg px-4 py-2 pl-10 text-sm text-emerald-300 focus:outline-none focus:border-emerald-500 transition">
          <i class="fa-solid fa-search absolute left-3 top-3 text-slate-500 text-sm"></i>
        </div>
        <button onclick="openAdminModal()" class="bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 px-3.5 py-2 rounded-lg border border-emerald-500/40 text-sm font-semibold transition flex items-center gap-2 whitespace-nowrap">
          <i class="fa-solid fa-lock"></i> Admin
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto px-4 mt-6">
    <!-- Quick Metrics -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="glass-card p-4 rounded-xl border-l-4 border-emerald-500">
        <p class="text-xs text-slate-400">Mot Module</p>
        <p class="text-2xl font-bold text-emerald-400">04 Ti</p>
      </div>
      <div class="glass-card p-4 rounded-xl border-l-4 border-cyan-500">
        <p class="text-xs text-slate-400">Mot Class</p>
        <p id="totalClassCount" class="text-2xl font-bold text-cyan-400">26 Ti</p>
      </div>
      <div class="glass-card p-4 rounded-xl border-l-4 border-indigo-500">
        <p class="text-xs text-slate-400">Copy Button</p>
        <p class="text-2xl font-bold text-indigo-400">One-Click</p>
      </div>
      <div class="glass-card p-4 rounded-xl border-l-4 border-purple-500">
        <p class="text-xs text-slate-400">Status</p>
        <p class="text-2xl font-bold text-purple-400">Secure Active</p>
      </div>
    </div>

    <!-- Modules Container -->
    <div id="modulesContainer" class="space-y-4">
      <!-- Dynamic rendering via JS -->
    </div>
  </main>

  <!-- Admin Login / Panel Modal -->
  <div id="adminModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="glass-card w-full max-w-lg p-6 rounded-2xl border border-emerald-500/40 shadow-2xl relative">
      <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <!-- Step 1: Login Form -->
      <div id="adminLoginView">
        <div class="flex items-center gap-3 mb-4">
          <div class="w-10 h-10 rounded-lg bg-red-500/10 border border-red-500/40 flex items-center justify-center text-red-400 font-bold">
            <i class="fa-solid fa-lock"></i>
          </div>
          <div>
            <h3 class="font-bold text-lg text-slate-100">Admin Authentication</h3>
            <p class="text-xs text-slate-400">Enter secure admin password to continue</p>
          </div>
        </div>
        <div class="space-y-3">
          <input type="password" id="adminPasswordInput" placeholder="Enter Admin Password..." 
                 class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
          <button onclick="verifyAdmin()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 rounded-lg transition text-sm">
            Login Securely
          </button>
          <p id="loginError" class="text-xs text-red-400 text-center hidden">Incorrect Password! Try again.</p>
        </div>
      </div>

      <!-- Step 2: Admin Dashboard / Add Form -->
      <div id="adminDashboardView" class="hidden">
        <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-user-shield text-emerald-400"></i>
            <h3 class="font-bold text-slate-100">Secure Admin Panel</h3>
          </div>
          <button onclick="logoutAdmin()" class="text-xs bg-red-500/20 text-red-400 px-3 py-1 rounded border border-red-500/30">Logout</button>
        </div>

        <form id="addReportForm" onsubmit="handleAddReport(event)" class="space-y-3">
          <div>
            <label class="text-xs text-slate-400 block mb-1">Select Module Folder</label>
            <select id="targetModule" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
              <option value="m04">Module 04 — Basic Reporting</option>
              <option value="m05">Module 05 — Advanced Facebook Reports</option>
              <option value="m06">Module 06 — Copyright Section</option>
              <option value="m07">Module 07 — TikTok Section</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-slate-400 block mb-1">Class Number</label>
              <input type="text" id="newClassNum" placeholder="e.g. Class 40" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
            </div>
            <div>
              <label class="text-xs text-slate-400 block mb-1">Report Name</label>
              <input type="text" id="newClassName" placeholder="e.g. Custom Report" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
            </div>
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Report Form URL Link</label>
            <input type="url" id="newFormLink" placeholder="https://www.facebook.com/help/contact/..." required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Additional Text / Description</label>
            <textarea id="newAdditional" rows="3" placeholder="Write additional report text..." required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200"></textarea>
          </div>
          <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 rounded-lg transition text-sm">
            Add New Report Class
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-5 right-5 bg-emerald-500 text-slate-950 font-semibold px-4 py-2 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2 z-50">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toastMsg">Copy kora hoyeche!</span>
  </div>

  <script>
    // Default Base Database
    const defaultReportData = [
      {
        id: "m04",
        title: "🔰 Module 04 — Basic Reporting",
        classes: [
          { classNum: "Class 14", name: "18+ ID Report", formLink: "https://www.facebook.com/help/contact/274459462613911", additional: "Hello Facebook Team,\nThis user is continuously sharing explicit 18+ adult content..." },
          { classNum: "Class 15", name: "18+ Page Report", formLink: "https://www.facebook.com/help/contact/164405897002583", additional: "Dear Facebook Support Team,\nThis page is publicly distributing adult explicit 18+ videos..." },
          { classNum: "Class 16", name: "18+ Group Report", formLink: "https://www.facebook.com/help/contact/211467438964344", additional: "Hello Team,\nThis Facebook group is actively used as a hub for sharing unauthorized explicit 18+..." },
          { classNum: "Class 17", name: "Clone Account Report", formLink: "https://www.facebook.com/help/contact/295309487309948", additional: "Dear Facebook Security Team,\nThis profile is impersonating an authentic individual..." },
          { classNum: "Class 18", name: "Under-13 Child Report", formLink: "https://www.facebook.com/help/contact/208949572459582", additional: "Hello Meta Support,\nThis account belongs to a child who is clearly under the age of 13..." },
          { classNum: "Class 19", name: "Sex Offender Report", formLink: "https://www.facebook.com/help/contact/207005222725325", additional: "Hello Meta Safety Team,\nI am reporting a convicted sex offender operating on Meta..." }
        ]
      },
      {
        id: "m05",
        title: "🔰 Module 05 — Advanced Facebook Reports",
        classes: [
          { classNum: "Class 20", name: "Imposter Report", formLink: "https://www.facebook.com/help/contact/169486816475808", additional: "Hello Support Team,\nAn unauthorized individual is posing as me/my organization..." },
          { classNum: "Class 21", name: "Defamation Report", formLink: "https://www.facebook.com/help/contact/430253293783305", additional: "Dear Meta Legal Team,\nThis target URL contains false, defamatory, and malicious accusations..." },
          { classNum: "Class 22", name: "Privacy Violation Report", formLink: "https://www.facebook.com/help/contact/144059062408922", additional: "Hello Meta Privacy Team,\nMy private personal information has been published..." },
          { classNum: "Class 23", name: "Memorialization Request", formLink: "https://www.facebook.com/help/contact/228813257197480", additional: "Hello Meta Support,\nWe regret to inform you that the account owner has passed away..." },
          { classNum: "Class 24", name: "Legacy Contact Setup", formLink: "https://www.facebook.com/help/1070092263000930", additional: "Meta Guide:\nNavigate to Settings & Privacy > Settings > Personal Details..." },
          { classNum: "Class 25", name: "Legal Removal Request", formLink: "https://www.facebook.com/help/contact/144059062408922", additional: "To Meta Legal Department:\nThis content violates regional cyber laws and rights..." },
          { classNum: "Class 26", name: "Indian Grievance Officer (Facebook)", formLink: "https://www.facebook.com/help/contact/278770247037226", additional: "To the Grievance Officer (India),\nI am submitting a formal grievance complaint..." },
          { classNum: "Class 27", name: "Indian Grievance Officer (Instagram)", formLink: "https://help.instagram.com/contact/278770247037226", additional: "To the Instagram Grievance Officer,\nSubmitting a formal complaint under IT Rules..." },
          { classNum: "Class 28", name: "Instagram Report Fake & Form Report", formLink: "https://help.instagram.com/contact/636276399721841", additional: "Dear Instagram Safety Team,\nThis account is operating as a fake profile..." }
        ]
      },
      {
        id: "m06",
        title: "🔰 Module 06 — Copyright Section",
        classes: [
          { classNum: "Class 29", name: "Facebook → Facebook Copyright", formLink: "https://www.facebook.com/help/contact/1758255661104383", additional: "To Meta Copyright Agent,\nI am the exclusive copyright holder..." },
          { classNum: "Class 30", name: "Facebook → TikTok Copyright", formLink: "https://www.tiktok.com/legal/report/Copyright", additional: "Dear TikTok IP Team,\nMy original video published on Facebook has been stolen..." },
          { classNum: "Class 31", name: "Instagram → Facebook Copyright", formLink: "https://www.facebook.com/help/contact/1758255661104383", additional: "Dear Meta Intellectual Property Team,\nMy copyrighted media posted on Instagram..." },
          { classNum: "Class 32", name: "Blogger → Facebook Copyright", formLink: "https://www.facebook.com/help/contact/1758255661104383", additional: "Hello Copyright Department,\nArticles and original media published on my official Blogger..." },
          { classNum: "Class 33", name: "Third-Party Copyright Claim", formLink: "https://www.facebook.com/help/contact/1758255661104383", additional: "As an authorized legal representative of the copyright owner..." },
          { classNum: "Class 34", name: "Multiple Copyright Claims", formLink: "https://www.facebook.com/help/contact/1758255661104383", additional: "Hello Meta IP Team,\nThis page/account repeatedly infringes upon multiple copyrighted works..." }
        ]
      },
      {
        id: "m07",
        title: "🔰 Module 07 — TikTok Section",
        classes: [
          { classNum: "Class 35", name: "10+ TikTok Account toiri", formLink: "https://www.tiktok.com/signup", additional: "Guide/Tips:\nUse Temp Mail or Alias Email services + Multiple Chrome Profiles..." },
          { classNum: "Class 36", name: "TikTok Fake Report", formLink: "https://www.tiktok.com/legal/report/feedback", additional: "Dear TikTok Support,\nThis user profile is impersonating a well-known person..." },
          { classNum: "Class 37", name: "TikTok Underage Report", formLink: "https://www.tiktok.com/legal/report/feedback", additional: "Hello TikTok Safety Team,\nThis user is clearly under the minimum required age..." },
          { classNum: "Class 38", name: "TikTok Privacy Violation Report", formLink: "https://www.tiktok.com/legal/report/privacy", additional: "Hello TikTok Legal,\nMy private media and confidential personal information..." },
          { classNum: "Class 39", name: "TikTok → Facebook Copyright Report", formLink: "https://www.facebook.com/help/contact/1758255661104383", additional: "Dear Meta IP Team,\nMy original video published on TikTok has been re-uploaded..." }
        ]
      }
    ];

    // Load from LocalStorage if exists
    let reportData = JSON.parse(localStorage.getItem("signalHackersReports")) || defaultReportData;

    function updateClassCount() {
      let total = 0;
      reportData.forEach(m => total += m.classes.length);
      document.getElementById("totalClassCount").innerText = total + " Ti";
    }

    function renderModules(filter = "") {
      const container = document.getElementById("modulesContainer");
      container.innerHTML = "";
      updateClassCount();

      reportData.forEach((mod) => {
        const filteredClasses = mod.classes.filter(c => 
          c.name.toLowerCase().includes(filter.toLowerCase()) || 
          c.classNum.toLowerCase().includes(filter.toLowerCase())
        );

        if (filter !== "" && filteredClasses.length === 0) return;

        const folderEl = document.createElement("div");
        folderEl.className = "glass-card rounded-xl overflow-hidden transition-all duration-300";

        const isSearching = filter !== "";

        folderEl.innerHTML = `
          <div onclick="toggleFolder('${mod.id}')" 
               class="folder-header p-4 flex justify-between items-center cursor-pointer select-none border-b border-emerald-500/10">
            <div class="flex items-center gap-3">
              <i class="fa-solid fa-folder-closed text-emerald-400 text-xl transition-transform duration-300" id="icon-${mod.id}"></i>
              <h2 class="font-bold text-lg text-slate-100">${mod.title}</h2>
              <span class="text-xs bg-emerald-500/20 text-emerald-300 px-2.5 py-0.5 rounded-full border border-emerald-500/30">
                ${filteredClasses.length} Items
              </span>
            </div>
            <i class="fa-solid fa-chevron-down text-slate-400 text-sm transition-transform duration-300" id="arrow-${mod.id}"></i>
          </div>

          <div id="content-${mod.id}" class="${isSearching ? 'block' : 'hidden'} p-4 space-y-4 bg-slate-950/40">
            ${filteredClasses.map((c, index) => `
              <div class="p-4 rounded-lg bg-slate-900/80 border border-slate-800 hover:border-emerald-500/30 transition flex flex-col gap-3">
                <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-2">
                  <div class="flex items-center gap-2">
                    <span class="text-xs font-mono font-bold text-emerald-400 bg-emerald-500/10 px-2 py-1 rounded border border-emerald-500/20">
                      ${c.classNum}
                    </span>
                    <h3 class="font-bold text-slate-200">${c.name}</h3>
                  </div>
                  
                  <div class="flex flex-wrap items-center gap-2">
                    <button onclick="copyToClipboard('${c.formLink}', 'Form Link')" 
                            class="text-xs bg-slate-800 hover:bg-slate-700 text-emerald-300 px-3 py-1.5 rounded-md border border-slate-700 flex items-center gap-1.5 transition">
                      <i class="fa-solid fa-link"></i> Link Copy
                    </button>
                    <a href="${c.formLink}" target="_blank" 
                       class="text-xs bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 px-3 py-1.5 rounded-md border border-emerald-500/40 flex items-center gap-1.5 transition">
                      <i class="fa-solid fa-arrow-up-right-from-square"></i> Open Form
                    </a>
                  </div>
                </div>

                <div class="text-[11px] font-mono text-cyan-400 bg-slate-950/60 px-3 py-1.5 rounded border border-cyan-500/20 truncate flex justify-between items-center">
                  <div><span class="text-slate-400">Link:</span> ${c.formLink}</div>
                </div>

                <div class="relative mt-1">
                  <div class="text-xs font-mono text-slate-400 bg-slate-950/80 p-3 rounded-lg border border-slate-800/80 whitespace-pre-wrap pr-16">
                    ${c.additional}
                  </div>
                  <button onclick="copyToClipboard(\`${c.additional.replace(/`/g, '\\`')}\`, 'Additional Text')" 
                          class="absolute top-2 right-2 text-xs bg-emerald-500/10 hover:bg-emerald-500/30 text-emerald-400 px-2.5 py-1 rounded border border-emerald-500/30 transition flex items-center gap-1">
                    <i class="fa-regular fa-copy"></i> Copy Text
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        `;

        container.appendChild(folderEl);
        if(isSearching) {
          document.getElementById(`icon-${mod.id}`)?.classList.replace('fa-folder-closed', 'fa-folder-open');
          document.getElementById(`arrow-${mod.id}`)?.classList.add('rotate-180');
        }
      });
    }

    function toggleFolder(id) {
      const content = document.getElementById(`content-${id}`);
      const icon = document.getElementById(`icon-${id}`);
      const arrow = document.getElementById(`arrow-${id}`);

      if (content.classList.contains('hidden')) {
        content.classList.remove('hidden');
        icon.classList.replace('fa-folder-closed', 'fa-folder-open');
        arrow.classList.add('rotate-180');
      } else {
        content.classList.add('hidden');
        icon.classList.replace('fa-folder-open', 'fa-folder-closed');
        arrow.classList.remove('rotate-180');
      }
    }

    // Admin Modal Logic
    const ADMIN_PASS = "admin123"; // Apni apnar pasaword ekhane change kore nite paren

    function openAdminModal() {
      document.getElementById("adminModal").classList.remove("hidden");
      if(localStorage.getItem("signalHackersAdminAuth") === "true") {
        showAdminDashboard();
      } else {
        showAdminLogin();
      }
    }

    function closeAdminModal() {
      document.getElementById("adminModal").classList.add("hidden");
    }

    function verifyAdmin() {
      const pass = document.getElementById("adminPasswordInput").value;
      if(pass === ADMIN_PASS) {
        localStorage.setItem("signalHackersAdminAuth", "true");
        showAdminDashboard();
        document.getElementById("loginError").classList.add("hidden");
      } else {
        document.getElementById("loginError").classList.remove("hidden");
      }
    }

    function showAdminLogin() {
      document.getElementById("adminLoginView").classList.remove("hidden");
      document.getElementById("adminDashboardView").classList.add("hidden");
    }

    function showAdminDashboard() {
      document.getElementById("adminLoginView").classList.add("hidden");
      document.getElementById("adminDashboardView").classList.remove("hidden");
    }

    function logoutAdmin() {
      localStorage.removeItem("signalHackersAdminAuth");
      showAdminLogin();
    }

    function handleAddReport(e) {
      e.preventDefault();
      const modId = document.getElementById("targetModule").value;
      const classNum = document.getElementById("newClassNum").value;
      const name = document.getElementById("newClassName").value;
      const formLink = document.getElementById("newFormLink").value;
      const additional = document.getElementById("newAdditional").value;

      const targetMod = reportData.find(m => m.id === modId);
      if(targetMod) {
        targetMod.classes.push({ classNum, name, formLink, additional });
        localStorage.setItem("signalHackersReports", JSON.stringify(reportData));
        renderModules();
        closeAdminModal();
        showToast("Notun Report Class Safolvabey Add Hoyeche!");
        document.getElementById("addReportForm").reset();
      }
    }

    function copyToClipboard(text, label) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`${label} safolvabey copy kora hoyeche!`);
      }).catch(err => {
        showToast(`Copy korte somossa hoyeche!`);
      });
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      const toastMsg = document.getElementById("toastMsg");
      toastMsg.innerText = message;
      toast.classList.remove("translate-y-20", "opacity-0");
      setTimeout(() => {
        toast.classList.add("translate-y-20", "opacity-0");
      }, 2500);
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      renderModules(e.target.value.trim());
    });

    renderModules();
  </script>
</body>
</html>
